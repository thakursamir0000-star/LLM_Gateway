# Production-scale LLM Gateway Docker Compose
# Architecture:
# - PostgreSQL 16 for shared persistent data (requests, calls, releases, budget reservations).
# - Redis 7 for distributed rate limits, provider cooldowns, and circuit breakers.
# - One-shot Alembic migration service.
# - Two gateway replicas (primary on :8000, replica on :8001) sharing Postgres and Redis.
# - Dashboard on localhost:8501 reading shared PostgreSQL state.

x-image: &image
  build:
    context: .
    args:
      WITH_EMBEDDINGS: ${WITH_EMBEDDINGS:-false}
  image: llm-gateway:local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway_local_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:54320:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--save", ""]
    ports:
      - "127.0.0.1:63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  migrations:
    <<: *image
    command: ["python", "-m", "gateway.migrations", "upgrade", "head"]
    environment:
      GATEWAY_DATABASE_URL: postgresql+psycopg://gateway:gateway_local_password@postgres:5432/gateway
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  gateway:
    <<: *image
    env_file:
      - path: .env
        required: false
    environment:
      GATEWAY_DATABASE_URL: postgresql+psycopg://gateway:gateway_local_password@postgres:5432/gateway
      GATEWAY_STATE_BACKEND: redis
      GATEWAY_REDIS_URL: redis://redis:6379/0
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  gateway-replica:
    <<: *image
    env_file:
      - path: .env
        required: false
    environment:
      GATEWAY_DATABASE_URL: postgresql+psycopg://gateway:gateway_local_password@postgres:5432/gateway
      GATEWAY_STATE_BACKEND: redis
      GATEWAY_REDIS_URL: redis://redis:6379/0
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  dashboard:
    <<: *image
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    environment:
      GATEWAY_DATABASE_URL: postgresql+psycopg://gateway:gateway_local_password@postgres:5432/gateway
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    profiles:
      - proxy
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
      gateway-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
