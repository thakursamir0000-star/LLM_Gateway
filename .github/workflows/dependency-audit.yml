name: dependency audit

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # every Monday: new advisories appear without any change here
  workflow_dispatch:

jobs:
  audit:
    name: lock files and known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the tools (pinned)
        run: pip install "uv==0.13.9" "pip-audit==2.10.1"
      - name: Lock files match requirements*.txt
        # uv keeps the existing pins, so this only fails when a requirements file changed without a new lock.
        run: |
          uv pip compile requirements.txt --universal --python-version 3.11 --generate-hashes --quiet -o requirements.lock
          uv pip compile requirements-dev.txt --universal --python-version 3.11 --generate-hashes --quiet -o requirements-dev.lock
          git diff --exit-code requirements.lock requirements-dev.lock
      - name: No known vulnerabilities (policy and exceptions in SECURITY.md)
        run: |
          IGNORES=$(grep -Ev '^\s*(#|$)' .github/pip-audit-exceptions.txt | awk '{print "--ignore-vuln " $1}' | tr '\n' ' ')
          for lock in requirements.lock requirements-dev.lock; do
            echo "== $lock"
            pip-audit --disable-pip --require-hashes --progress-spinner off $IGNORES -r "$lock"
          done
