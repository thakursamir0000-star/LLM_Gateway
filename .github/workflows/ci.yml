name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: lint and test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gateway_test
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies (exact versions and hashes from the lock)
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Lint
        run: ruff check .
      - name: PostgreSQL 16 integration tests
        # Each test creates and drops its own database on this throwaway service. In GitHub Actions the
        # tests fail (never skip) if TEST_POSTGRES_URL is missing or the server can't be reached.
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://gateway:gateway_test_password@localhost:5432/gateway_test
        run: pytest tests/test_postgres_integration.py -v -rs
      - name: Test (unit, SQLite, Redis distributed state, and migrations)
        env:
          GATEWAY_DATABASE_URL: postgresql+psycopg://gateway:gateway_test_password@localhost:5432/gateway_test
          GATEWAY_REDIS_URL: redis://localhost:6379/0
        run: pytest --ignore=tests/test_postgres_integration.py

  docker:
    name: docker build and multi-instance smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate the compose file
        run: docker compose config --quiet
      - name: Build the image
        run: docker build -t llm-gateway:local .
      - name: Run multi-instance compose stack with fake providers
        run: |
          CI_KEY="ci-$(openssl rand -hex 16)"
          echo "::add-mask::$CI_KEY"
          echo "GATEWAY_FAKE_PROVIDERS=1" >> .env
          echo "GATEWAY_API_KEYS=ci-smoke:$CI_KEY" >> .env
          echo "GATEWAY_ADMIN_KEY=ci-admin-key" >> .env

          docker compose up -d postgres redis migrations
          # Wait for migrations to complete
          docker compose wait migrations
          # Loopback-only dashboard exposure: -p 127.0.0.1:8501:8501
          docker compose up -d gateway gateway-replica dashboard

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && curl -sf http://127.0.0.1:8001/health && break
            sleep 1
          done

          # Health and readiness on both replicas
          curl -sf http://127.0.0.1:8000/health
          curl -sf http://127.0.0.1:8001/health
          curl -sf http://127.0.0.1:8000/ready
          curl -sf http://127.0.0.1:8001/ready

          BODY='{"model": "auto", "messages": [{"role": "user", "content": "Say hello"}]}'
          # Unauthenticated returns 401
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/v1/chat/completions \
            -H 'Content-Type: application/json' -d "$BODY")
          if [ "$STATUS" != "401" ]; then echo "expected 401 without credentials, got $STATUS"; exit 1; fi

          # Authenticated chat works on replica 1
          RESP1=$(curl -sf http://127.0.0.1:8000/v1/chat/completions -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $CI_KEY" -d "$BODY")
          echo "$RESP1" | grep -q '"chat.completion"'

          # Authenticated chat works on replica 2
          RESP2=$(curl -sf http://127.0.0.1:8001/v1/chat/completions -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $CI_KEY" -d "$BODY")
          echo "$RESP2" | grep -q '"chat.completion"'

          # Dashboard health check
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8501/dashboard/_stcore/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8501/dashboard/_stcore/health

      - name: Container logs
        if: always()
        run: docker compose logs
