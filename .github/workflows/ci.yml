name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: lint and test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test (fake providers and mocked HTTP; no API keys, no LLM calls)
        run: pytest

  docker:
    name: docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate the compose file
        run: docker compose config --quiet
      - name: Build the image
        run: docker build -t llm-gateway:ci .
      - name: Smoke-test the gateway with fake providers
        run: |
          # Auth is fail-closed, so the job makes a throwaway bearer key for itself. Fake providers make no API calls.
          CI_KEY="ci-$(openssl rand -hex 16)"
          echo "::add-mask::$CI_KEY"
          docker run -d --name gateway -p 8000:8000 -e GATEWAY_FAKE_PROVIDERS=1 \
            -e GATEWAY_API_KEYS="ci-smoke:$CI_KEY" llm-gateway:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/health
          BODY='{"model": "auto", "messages": [{"role": "user", "content": "Say hello"}]}'
          # Without credentials the request must be refused.
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/v1/chat/completions \
            -H 'Content-Type: application/json' -d "$BODY")
          if [ "$STATUS" != "401" ]; then echo "expected 401 without credentials, got $STATUS"; exit 1; fi
          # With the job's key a fake provider answers.
          RESPONSE=$(curl -sf http://127.0.0.1:8000/v1/chat/completions -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $CI_KEY" -d "$BODY")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"chat.completion"'
      - name: Smoke-test the dashboard in the same image
        run: |
          docker run -d --name dashboard -p 8501:8501 llm-gateway:ci \
            streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8501/_stcore/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8501/_stcore/health
      - name: Container logs
        if: always()
        run: |
          docker logs gateway || true
          docker logs dashboard || true
