# LLM Gateway configuration.
# Paths are relative to the project root. Environment overrides:
#   GATEWAY_CONFIG  another config file
#   GATEWAY_DB      the SQLite request log (storage.db_path)

# ── Models ──────────────────────────────────────────────────────────
# Each alias names one provider model. Prices are USD per 1M tokens and are
# used for cost tracking, budgets and the router evaluation.
# Groq prices are Groq's on-demand prices as listed for its endpoint on
# OpenRouter (2026-11-15); check https://groq.com/pricing before quoting costs.
# OpenRouter models: the price of the pinned host, checked with
# GET https://openrouter.ai/api/v1/models/<model>/endpoints on 2026-11-15; the
# gateway records the cost OpenRouter reports for each call instead when it
# has one. The Gemini API models run on the free tier here, so no price is set
# (cost shows as 0): set a list price to compare them on cost.
# `limits` are client-side pacing under free-tier limits (0 = off).
models:
  gpt-oss-20b:
    provider: groq
    model: openai/gpt-oss-20b
    price_per_1m: {input: 0.075, output: 0.30}
    limits: {rpm: 30, tpm: 8000}
    params: {reasoning_effort: low}
  gpt-oss-120b:
    provider: groq
    model: openai/gpt-oss-120b
    price_per_1m: {input: 0.15, output: 0.60}
    limits: {rpm: 30, tpm: 8000}
    params: {reasoning_effort: low}
  # The same open-weight models through OpenRouter, pinned to one full-precision
  # (bf16) host so a comparison isn't mixed across hosts and quantizations
  # (OpenRouter serves these models from 12 and 26 hosts, fp4 to bf16).
  or-gpt-oss-20b:
    provider: openrouter
    model: openai/gpt-oss-20b
    price_per_1m: {input: 0.03, output: 0.14}
    limits: {rpm: 30}
    params:
      reasoning_effort: low
      provider: {only: [deepinfra/bf16], allow_fallbacks: false}
  or-gpt-oss-120b:
    provider: openrouter
    model: openai/gpt-oss-120b
    price_per_1m: {input: 0.037, output: 0.17}
    limits: {rpm: 30}
    params:
      reasoning_effort: low
      provider: {only: [deepinfra/bf16], allow_fallbacks: false}
  gemini-4-hydrogen:
    provider: gemini
    model: gemini-4-hydrogen
    limits: {rpm: 10}       # free tier also allows only 20 requests per day
  gemma-4-31b:
    provider: gemini
    model: gemma-4-31b-it
    limits: {rpm: 10}

providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    timeout_s: 60
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GEMINI_API_KEY
    timeout_s: 120
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout_s: 120

# ── Prompts ─────────────────────────────────────────────────────────
# Versioned system prompts, named <name>@<version>. A release's prompt is put
# before the app's own messages; an empty prompt adds nothing.
prompts:
  passthrough@1: ""
  concise@1: "You are a helpful assistant. Answer accurately and concisely."

# ── Releases ────────────────────────────────────────────────────────
# A release pins the cheap model, the strong model and the prompt version.
# Activate, roll back or canary them with `python -m gateway.manage` or the
# /admin endpoints; every change is kept in the database's deployment log.
releases:
  v1:
    cheap: gpt-oss-20b
    strong: gpt-oss-120b
    prompt: passthrough@1
    note: Groq gpt-oss pair the router is trained for
  v2-gemma:
    cheap: gemma-4-31b
    strong: gpt-oss-120b
    prompt: concise@1
    note: candidate - Gemma on the Gemini API as the cheap model
  v3-openrouter:
    cheap: or-gpt-oss-20b
    strong: or-gpt-oss-120b
    prompt: passthrough@1
    note: candidate - the same gpt-oss pair through OpenRouter (not active; compare first)
  v4-latency:
    cheap: gpt-oss-20b
    strong: gpt-oss-120b
    batch: {cheap: or-gpt-oss-20b, strong: or-gpt-oss-120b}
    prompt: passthrough@1
    note: >-
      interactive traffic on Groq (p50 0.7 s for 120b), batch traffic on OpenRouter's DeepInfra host
      (3.6x cheaper, slower); measured on 377 questions, see the README's provider comparison

# Starting state; the deployment log in the database takes over after the
# first activate / rollback / canary change.
deployment:
  active: v4-latency      # roll back to v1 (Groq only) with: python -m gateway.manage activate v1
  canary: null            # e.g. {release: v2-gemma, share: 0.1}

# ── Routing ─────────────────────────────────────────────────────────
# Modes: cheap | strong | router | cascade. A request picks one with its
# `model` field ("auto" = default_mode).
# classifier_threshold is the classifier's authoritative runtime default. It
# must match the selected threshold recorded in the trained artifact or the
# gateway refuses to load that classifier. threshold remains the default for
# the rules router and cascade. Higher = more quality and more cost. Override
# either default per request with the X-Gateway-Threshold header.
# default_mode is strong: on the measured questions the strong model was the
# better buy (on OpenRouter it costs 17% more than the cheap one), and the
# provider is chosen by latency class instead (below). The rule router stays
# available with model="router".
routing:
  default_mode: strong
  router: classifier      # rules | classifier (falls back to rules until a model is trained)
  classifier_path: models/router.json
  classifier_threshold: 0.955
  threshold: 0.5
  fallback_on_error: true # chosen model, same tier on the other provider, then both other-tier models

# ── Latency classes ─────────────────────────────────────────────────
# interactive | batch. A request sets it with the X-Gateway-Latency header;
# otherwise the app's default here, otherwise `default`. A release's `batch`
# models serve batch traffic (releases without them use the same models).
latency:
  default: interactive
  apps:
    batch: batch

retries:
  attempts: 3
  max_wait_s: 10          # longest the gateway holds a request for a rate limit
  quota_cooldown_s: 300   # skip a model this long after a quota error (daily limit, no credits)

# ── Circuit breaker ─────────────────────────────────────────────────
# Per provider. Opens after failure_threshold qualifying failures in a row;
# after recovery_timeout_s, half_open_probes test requests are allowed through.
circuit_breaker:
  failure_threshold: 5
  recovery_timeout_s: 30.0
  half_open_probes: 1

# ── Budgets ─────────────────────────────────────────────────────────
# Daily USD limit per app (UTC day). Over the soft limit, router/cascade/strong
# requests go to the cheap model; at the limit, requests get HTTP 429.
# Each request reserves its estimated maximum cost (capped at what is left)
# before calling a provider, so concurrent requests can't share the same
# remaining budget; the reservation is settled when the request is logged.
budgets:
  default_daily_usd: 1.0
  soft_limit_fraction: 0.8
  reserve_output_tokens: 4096   # output tokens assumed when a request sets no max_tokens
  reservation_ttl_s: 900        # a reservation a crashed request never settled expires after this
  apps:
    demo: {daily_usd: 0.20}

# ── Alerts ──────────────────────────────────────────────────────────
# Checked at most every check_interval_s; logged, stored, and POSTed as JSON
# to the URL in $ALERT_WEBHOOK_URL when it is set.
alerts:
  error_rate: 0.2         # share of failed requests in the window
  window_minutes: 15
  min_requests: 20        # fewer requests in the window: no error-rate alert
  daily_cost_usd: 5.0
  check_interval_s: 60
  webhook_env: ALERT_WEBHOOK_URL

# ── Auth ────────────────────────────────────────────────────────────
# $GATEWAY_API_KEYS="app1:key1,app2:key2" turns on bearer-key auth (the key
# names the app). By default, authentication is fail-closed (allow_anonymous: false).
# Admin endpoints need $GATEWAY_ADMIN_KEY in the X-Admin-Key header; unset,
# they are off (the CLI still works).
auth:
  keys_env: GATEWAY_API_KEYS
  admin_key_env: GATEWAY_ADMIN_KEY
  allow_anonymous: false

# ── Security ────────────────────────────────────────────────────────
# max_request_body_bytes limits the size of request payloads (default: 10MB).
# cors_origins specifies allowed CORS origins (empty list = restrictive).
# expose_internal_metadata controls whether internal routing diagnostics
# and custom response headers are exposed to external clients (default: false).
security:
  max_request_body_bytes: 10485760
  cors_origins: []
  expose_internal_metadata: false

storage:
  db_path: var/gateway.db
  pool_size: 5
  max_overflow: 10
  pool_timeout_s: 30
  pool_recycle_s: 1800

state:
  backend: memory
  redis:
    url: redis://localhost:6379/0
    socket_timeout_s: 2.0
    connect_timeout_s: 2.0
    max_connections: 50
