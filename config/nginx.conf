# Public entry point (Compose profile "proxy"): HTTPS in front of both gateway replicas and the dashboard.
# TLS files and the dashboard password file come from /etc/nginx/tls (GATEWAY_TLS_DIR, default ./config/tls;
# scripts/make_proxy_secrets.py creates development ones). Use certificates from a real CA in production.

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    upstream gateway_cluster {
        # Round-robin load balancing across both replicas
        server gateway:8000;
        server gateway-replica:8001;
    }

    upstream dashboard {
        server dashboard:8501;
    }

    # Plain HTTP: redirect to HTTPS. /health answers only inside the container (the proxy's own healthcheck).
    server {
        listen 80;
        server_name _;

        location = /health {
            allow 127.0.0.1;
            deny all;
            proxy_pass http://gateway_cluster;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security headers on every response (locations below add no headers of their own, so these apply).
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

        client_max_body_size 10M;

        # The admin API is not published: use the gateway's loopback ports (with X-Admin-Key) or the CLI.
        location /admin/ {
            return 403;
        }

        # Dashboard (Streamlit, served under /dashboard/) behind HTTP basic authentication.
        location /dashboard/ {
            auth_basic "LLM Gateway dashboard";
            auth_basic_user_file /etc/nginx/tls/dashboard.htpasswd;
            proxy_pass http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        location / {
            proxy_pass http://gateway_cluster;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streaming SSE support (prevent buffering chunked responses)
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 5s;
        }
    }
}
