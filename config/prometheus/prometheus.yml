# Prometheus for the Compose "monitoring" profile: scrapes both gateway replicas on the internal network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    # With GATEWAY_METRICS_TOKEN set on the gateway, delete the "# " before the next line and mount the token file
    # (docs/RUNBOOK.md, section 2 step 5); otherwise every scrape gets 401.
    # authorization: {type: Bearer, credentials_file: /etc/prometheus/metrics-token}
    static_configs:
      - targets: ["gateway:8000", "gateway-replica:8001"]
